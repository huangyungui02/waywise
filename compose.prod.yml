name: travel-agent

services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: waywise
      POSTGRES_DB: waywise
      POSTGRES_PASSWORD: waywise
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waywise -d waywise"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  travel-agent:
    build: .
    env_file:
      - .env
    environment:
      ACCESS_TOKEN: ${ACCESS_TOKEN:?请在 .env 设置 ACCESS_TOKEN}
      DATABASE_URL: postgresql://waywise:waywise@postgres:5432/waywise
      DBOS_DATABASE_URL: postgresql://waywise:waywise@postgres:5432/waywise
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?请在 .env 设置 DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      travel-agent:
        condition: service_healthy
    restart: unless-stopped
    init: true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
