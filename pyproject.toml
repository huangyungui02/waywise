[project]
name = "travel-agent"
version = "0.1.0"
description = "国内旅行规划：PydanticAI + 高德 MCP + 飞猪 Skill"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[mcp,openai,web,dbos]==2.66.0",
    "pydantic-ai-harness[skills]==0.66.0",
    "pydantic-settings>=2.12,<3",
    "fastapi>=0.162.0",
    "logfire[fastapi]>=5.4,<6",
    "sqlalchemy[asyncio]>=2.1.8,<3",
    "dbos[otel]>=3.5,<4",
    "psycopg[binary]>=3.3,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.17.4",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
