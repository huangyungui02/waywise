services:
  travel-agent:
    build: .
    ports:
      - "127.0.0.1:7932:7932"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/travel.db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - travel-data:/app/data
    restart: unless-stopped
    init: true

  redis:
    image: redis:8.8.0-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6372:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  travel-data:
  redis-data:
