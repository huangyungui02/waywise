services:
  travel-agent:
    build: .
    ports:
      - "127.0.0.1:7932:7932"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/travel.db
      DBOS_DATABASE_PATH: /app/data/dbos.sqlite
    volumes:
      - travel-data:/app/data
    restart: unless-stopped
    init: true

volumes:
  travel-data:
